<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#C85A32">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>📖 Stories · Kabootar</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">

  <!-- Top Bar -->
  <div class="top-bar">
    <span class="back" onclick="goHome()">←</span>
    <span class="logo">📖</span>
    <span class="title">Stories</span>
  </div>

  <!-- Header -->
  <div class="screen-header">
    <h1>Daak</h1>
    <div class="sub">Status that fades in 24 hours</div>
  </div>

  <!-- My Story -->
  <div class="item" style="margin:0 16px 8px" onclick="addMyStory()">
    <div style="position:relative;width:56px;height:56px;flex-shrink:0">
      <div class="avatar" style="width:56px;height:56px;font-size:20px">AS</div>
      <div style="position:absolute;bottom:-2px;right:-2px;width:22px;height:22px;border-radius:50%;background:#C85A32;color:#FFF;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;border:2px solid #FFF">+</div>
    </div>
    <div class="info">
      <div class="name">My Story</div>
      <div class="preview">Tap to add to your story</div>
    </div>
  </div>

  <!-- Recent Updates -->
  <div class="section-title">Recent Updates</div>
  <div class="story-tray" id="story-tray"></div>

  <!-- Viewed -->
  <div class="section-title">Recently Viewed</div>
  <div class="list" style="padding-top:0;padding-bottom:90px" id="viewed-list"></div>

  <!-- Story Viewer -->
  <div class="story-viewer" id="story-viewer">
    <div class="story-progress-container" id="progress-container"></div>

    <div class="story-header">
      <div class="avatar" id="story-avatar">?</div>
      <div class="info">
        <div class="name" id="story-name">User</div>
        <div class="time" id="story-time">just now</div>
      </div>
      <button class="close-btn" onclick="closeStory(event)">✕</button>
    </div>

    <img class="story-image" id="story-image" src="" alt="">
    <div class="story-caption" id="story-caption"></div>

    <div class="nav-zone left" onclick="prevStory(event)"></div>
    <div class="nav-zone right" onclick="nextStory(event)"></div>

    <div class="reactions-drawer" id="reactions-drawer">
      <button class="reaction-emoji" onclick="sendReaction('❤️')">❤️</button>
      <button class="reaction-emoji" onclick="sendReaction('😂')">😂</button>
      <button class="reaction-emoji" onclick="sendReaction('😮')">😮</button>
      <button class="reaction-emoji" onclick="sendReaction('😢')">😢</button>
      <button class="reaction-emoji" onclick="sendReaction('🔥')">🔥</button>
      <button class="reaction-emoji" onclick="sendReaction('👏')">👏</button>
    </div>

    <div class="story-reply">
      <div class="input">
        <input type="text" placeholder="Reply to story..." id="story-reply-input"
               onfocus="hideReactions()"
               onkeypress="if(event.key==='Enter') sendReply()">
        <button class="emoji-btn" onclick="toggleReactions()">😊</button>
      </div>
      <button class="send-btn" onclick="sendReply()">➤</button>
    </div>
  </div>

  <!-- Bottom Tabs -->
  <div class="tabs">
    <div class="tab" onclick="goHome()">
      <div class="tab-icon">👥</div><div class="tab-label">Contacts</div>
    </div>
    <div class="tab active" onclick="goHome()">
      <div class="tab-icon">📖</div><div class="tab-label">Stories</div>
    </div>
    <div class="tab" onclick="goHome()">
      <div class="tab-icon">💬</div><div class="tab-label">Chats</div>
    </div>
    <div class="tab" onclick="goHome()">
      <div class="tab-icon">📞</div><div class="tab-label">Calls</div>
    </div>
    <div class="tab" onclick="goHome()">
      <div class="tab-icon">👤</div><div class="tab-label">Profile</div>
    </div>
    <div class="tab" onclick="showToast('🕊️ Kabootar AI coming soon')">
      <div class="tab-icon">🕊️</div><div class="tab-label">Kabootar</div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

</div>

<script>
/* ==================== DATA ==================== */
const stories = [
  {
    id: 1,
    name: "Priya Patel",
    avatar: "https://i.pravatar.cc/150?u=priya",
    time: "2 hours ago",
    viewed: false,
    items: [
      { image: "https://picsum.photos/seed/story1a/600/1000", caption: "Mumbai mornings 🌤️" },
      { image: "https://picsum.photos/seed/story1b/600/1000", caption: "Coffee time ☕" },
    ],
  },
  {
    id: 2,
    name: "Rohan Gupta",
    avatar: "https://i.pravatar.cc/150?u=rohan",
    time: "4 hours ago",
    viewed: false,
    items: [
      { image: "https://picsum.photos/seed/story2a/600/1000", caption: "Shipping day 🚀" },
    ],
  },
  {
    id: 3,
    name: "Aarav Sharma",
    avatar: "https://i.pravatar.cc/150?u=aarav",
    time: "6 hours ago",
    viewed: false,
    items: [
      { image: "https://picsum.photos/seed/story3a/600/1000", caption: "Weekend vibes ✨" },
      { image: "https://picsum.photos/seed/story3b/600/1000", caption: "Sunset 🌅" },
      { image: "https://picsum.photos/seed/story3c/600/1000" },
    ],
  },
  {
    id: 4,
    name: "Neha Verma",
    avatar: "https://i.pravatar.cc/150?u=neha",
    time: "10 hours ago",
    viewed: true,
    items: [
      { image: "https://picsum.photos/seed/story4a/600/1000", caption: "Design inspo 🎨" },
    ],
  },
  {
    id: 5,
    name: "Kabir Singh",
    avatar: "https://i.pravatar.cc/150?u=kabir",
    time: "12 hours ago",
    viewed: true,
    items: [
      { image: "https://picsum.photos/seed/story5a/600/1000", caption: "New palette study" },
      { image: "https://picsum.photos/seed/story5b/600/1000" },
    ],
  },
];

let currentStoryIdx = 0;
let currentItemIdx = 0;
let storyTimer = null;

/* ==================== RENDER ==================== */
function renderStories() {
  const tray = document.getElementById("story-tray");
  const viewed = document.getElementById("viewed-list");

  const unviewed = stories.filter(s => !s.viewed);
  tray.innerHTML = unviewed.length
    ? unviewed.map(s => storyRingHTML(s)).join("")
    : `<div style="padding:20px;color:#94A3B8;font-size:13px">All caught up ✨</div>`;

  const viewedList = stories.filter(s => s.viewed);
  viewed.innerHTML = viewedList.length
    ? viewedList.map(s => viewedItemHTML(s)).join("")
    : `<div class="empty"><div class="icon">👀</div><p>No viewed stories yet</p></div>`;
}

function storyRingHTML(s) {
  const initials = s.name.split(" ").map(p => p[0]).slice(0, 2).join("").toUpperCase();
  const timeShort = s.time.split(' ')[0] + s.time.split(' ')[1][0];
  return `
    <div class="story-ring ${s.viewed ? 'viewed' : ''}" onclick="openStory(${s.id})">
      <div class="circle">
        <div class="inner">
          <div class="avatar">
            <img src="${s.avatar}" alt="${s.name}" onerror="this.style.display='none'; this.parentNode.textContent='${initials}'">
          </div>
        </div>
      </div>
      <div class="label">${s.name.split(' ')[0]}</div>
    </div>
  `;
}

function viewedItemHTML(s) {
  const initials = s.name.split(" ").map(p => p[0]).slice(0, 2).join("").toUpperCase();
  const itemCount = s.items.length;
  return `
    <div class="item" onclick="openStory(${s.id})">
      <div class="avatar sm">
        <img src="${s.avatar}" onerror="this.style.display='none'; this.parentNode.textContent='${initials}'">
      </div>
      <div class="info">
        <div class="name">${s.name}</div>
        <div class="preview">
          <span style="color:#10B981;font-size:14px">👁</span>
          ${itemCount} ${itemCount === 1 ? 'photo' : 'photos'} · ${s.time}
        </div>
      </div>
      <span style="color:#94A3B8;font-size:20px">›</span>
    </div>
  `;
}

/* ==================== STORY VIEWER ==================== */
function openStory(id) {
  const idx = stories.findIndex(s => s.id === id);
  if (idx < 0) return;
  currentStoryIdx = idx;
  currentItemIdx = 0;
  startStory();
}

function startStory() {
  const story = stories[currentStoryIdx];
  if (!story) return;
  story.viewed = true;

  const initials = story.name.split(" ").map(p => p[0]).slice(0, 2).join("").toUpperCase();
  document.getElementById("story-name").textContent = story.name;
  document.getElementById("story-time").textContent = story.time;
  const avatarEl = document.getElementById("story-avatar");
  avatarEl.innerHTML = `<img src="${story.avatar}" style="width:100%;height:100%;object-fit:cover;border-radius:50%" onerror="this.parentNode.textContent='${initials}'">`;

  const progressContainer = document.getElementById("progress-container");
  progressContainer.innerHTML = story.items.map((_, i) => {
    let cls = "";
    if (i < currentItemIdx) cls = "done";
    else if (i === currentItemIdx) cls = "active";
    return `<div class="progress-segment ${cls}"><div class="fill"></div></div>`;
  }).join("");

  const item = story.items[currentItemIdx];
  document.getElementById("story-image").src = item.image;
  document.getElementById("story-caption").textContent = item.caption || "";

  document.getElementById("story-viewer").classList.add("open");

  clearTimeout(storyTimer);
  storyTimer = setTimeout(() => nextStory(), 5000);

  renderStories();
}

function nextStory(event) {
  if (event) event.stopPropagation();
  const story = stories[currentStoryIdx];
  if (!story) return;
  currentItemIdx++;
  if (currentItemIdx >= story.items.length) {
    const nextIdx = stories.findIndex((s, i) => i > currentStoryIdx && !s.viewed);
    if (nextIdx >= 0) {
      currentStoryIdx = nextIdx;
      currentItemIdx = 0;
      startStory();
    } else if (currentStoryIdx + 1 < stories.length) {
      currentStoryIdx++;
      currentItemIdx = 0;
      startStory();
    } else {
      closeStory();
    }
  } else {
    startStory();
  }
}

function prevStory(event) {
  if (event) event.stopPropagation();
  if (currentItemIdx > 0) {
    currentItemIdx--;
    startStory();
  } else if (currentStoryIdx > 0) {
    currentStoryIdx--;
    currentItemIdx = 0;
    startStory();
  } else {
    startStory();
  }
}

function closeStory(event) {
  if (event) event.stopPropagation();
  clearTimeout(storyTimer);
  document.getElementById("story-viewer").classList.remove("open");
  hideReactions();
  renderStories();
}

/* ==================== ACTIONS ==================== */
function addMyStory() {
  showToast("Add to my story");
}

function sendReply() {
  const input = document.getElementById("story-reply-input");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  hideReactions();
  showToast(`Reply sent: ${text.substring(0, 20)}${text.length > 20 ? '...' : ''}`);
}

function toggleReactions() {
  document.getElementById("reactions-drawer").classList.toggle("open");
}

function hideReactions() {
  document.getElementById("reactions-drawer").classList.remove("open");
}

function sendReaction(emoji) {
  hideReactions();
  showToast(`Reacted ${emoji}`);
}

function goHome() {
  window.location.href = "index.html";
}

/* ==================== TOAST ==================== */
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(window.toastTimer);
  window.toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

/* ==================== INIT ==================== */
renderStories();

let lastTouchEnd = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });

document.addEventListener("keydown", (e) => {
  if (!document.getElementById("story-viewer").classList.contains("open")) return;
  if (e.key === "ArrowRight") nextStory();
  if (e.key === "ArrowLeft") prevStory();
  if (e.key === "Escape") closeStory();
});
</script>

</body>
</html>
